; Basic settings
max_execution_time = 30
memory_limit = 256M
error_reporting = E_ALL
display_errors = On
log_errors = On
error_log = /var/log/php_errors.log

; File upload settings
upload_max_filesize = 300M
post_max_size = 300M

; Session settings
session.save_path = "/var/lib/php/sessions"
session.gc_maxlifetime = 1440
